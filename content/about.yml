paragraphs:
  - prefix: With 4+ years of hands-on experience, I specialize in robust web applications and cloud infrastructure using Python, JavaScript, and Go. My journey began as a teenage coder chasing curiosity and turned into a career built on solving real, often unglamorous, problems.
  - prefix: At any given time I'm usually running more than one product. That's not scattered attention — it's how I stay sharp across the full stack, from PostgreSQL internals to the pixel-level detail of a landing page.
  - prefix: I founded and manage
    linkLabel: Addis Tech Jobs
    linkHref: https://www.linkedin.com/company/addis-tech-jobs/
    suffix: a free community initiative that has connected 3,500+ developers and followers with verified IT opportunities across LinkedIn, Telegram, and beyond.
  - prefix: As a technical writer, I publish
    linkLabel: tutorials and articles
    linkHref: https://medium.com/@samsonkebede4
    suffix: on Medium covering Python, Django, and AWS — practical write-ups aimed at developers stuck on the same backend and cloud problems I've already solved.
  - prefix: Beyond code, I mentor aspiring developers through workshops and speaking engagements, advocating for equal access to opportunity in Ethiopia's growing tech ecosystem.
pullQuote: I don't build demos. I build the sync job that runs at 3am, the schema that survives a pivot, and the interface someone opens without dreading it.
