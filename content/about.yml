  alt: About Samson
paragraphs:
  - prefix: With 4+ years of hands-on experience in software development, I specialize in crafting robust web applications and cloud infrastructure using Python, JavaScript, and Go. My journey began as a teenage coder and evolved into a passion for solving real-world problems through technology.
  - prefix: I founded and manage
    linkLabel: Addis Tech Jobs
    linkHref: https://www.linkedin.com/company/addis-tech-jobs/
    suffix: a community initiative that aggregates IT opportunities from LinkedIn, Telegram, and other platforms. To date, the page has attracted 3,500+ developers and followers by curating and sharing verified job openings completely free of charge.
  - prefix: As a technical writer, I publish
    linkLabel: tutorials and articles
    linkHref: https://medium.com/@samsonkebede4
    suffix: on Medium covering Python, Django, and AWS. My content focuses on practical solutions, helping developers overcome challenges in backend development and cloud architecture.
  - prefix: Beyond code, I mentor aspiring developers through workshops and speaking engagements, advocating for equal opportunities in Ethiopia's growing tech ecosystem.
